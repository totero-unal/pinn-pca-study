[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-pca-study"
version = "0.1.0"
description = "Empirical comparison of PINNs with PCA preprocessing"
requires-python = ">=3.12"
dependencies = [
    "jax[cpu]==0.12.0.1",
    "jaxlib==0.12.0.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<8",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
